name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-dependencies
      - name: Lint + format
        run: pnpm biome check
      - name: Check for unused files, deps, and exports
        run: pnpm check:unused

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-dependencies
      - name: Build
        run: pnpm build
      - name: Publint + attw
        run: pnpm test:build
      - name: Check size
        run: pnpm size

  types:
    name: Types
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        typescript: ['5.4.5', '5.9.3', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-dependencies
      - name: Pin TypeScript ${{ matrix.typescript }}
        run: pnpm add -D typescript@${{ matrix.typescript }}
      - name: Check types
        run: pnpm check:types
      - name: Typecheck tests
        run: pnpm test:typecheck

  test:
    name: Test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-dependencies
      - name: Test
        run: pnpm test -- --run

  # Live sign+broadcast smoke against the Nile testnet. Gated to `main` and
  # reads a funded key from secrets. Placeholder until v0.1b ships transport +
  # actions; kept here so the job shape / secret wiring is in place.
  e2e-nile:
    name: E2E (Nile testnet)
    needs: [build, types, test]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-dependencies
      - name: Run Nile e2e
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: 'echo "TODO(v0.1b): Nile sign+broadcast e2e smoke"'
        env:
          TRON_NILE_PRIVATE_KEY: ${{ secrets.TRON_NILE_PRIVATE_KEY }}
