name: Changesets
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  changesets:
    name: Create version PR or publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit version/changelog updates; create tags/releases
      pull-requests: write # open/update the release pull request
      id-token: write # npm provenance via trusted publishing
    steps:
      - name: Clone repository
        # SHA-pinned on the privileged publish path (contents/id-token write + NPM_TOKEN)
        # to prevent a retagged/hijacked action from exfiltrating credentials.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0 # full history so Changesets can build changelogs

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Create release pull request or publish
        uses: changesets/action@06245a4e0a36c064a573d4150030f5ec548e4fcc # v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
