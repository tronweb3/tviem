# pnpm settings (pnpm >= 10; the toolchain is pinned by `packageManager` in
# package.json).

# Single-package repo: only the root is a workspace member.
packages:
  - '.'

autoInstallPeers: false
enablePrePostScripts: true
strictPeerDependencies: false

# Security floors for transitive dependencies; the resolved versions are
# pinned in pnpm-lock.yaml. pnpm validates these against the lockfile, so a
# drifted copy fails `pnpm install --frozen-lockfile` instead of resolving
# without the floors.
overrides:
  postcss@<8.5.18: '>=8.5.18 <9'
  brace-expansion@<2.1.3: '>=2.1.3 <3'
  nanoid@<3.3.18: '>=3.3.18'
  smol-toml@<1.9.0: '>=1.9.0 <2'
  source-map-js@<1.2.2: '>=1.2.2 <2'
